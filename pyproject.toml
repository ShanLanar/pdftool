[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-optimizer"
version = "1.0.0"
description = "PDF-Komprimierung und OCR-Durchsuchbarkeit (GUI + CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "Pillow>=10.0",
    "psutil>=5.9",          # CPU-/Prioritätsbegrenzung (Schonmodus)
]

[project.optional-dependencies]
# OCR + Bild-/PDF-Hilfen (Tesseract/Ghostscript zusätzlich als Systemtools)
ocr = [
    "ocrmypdf>=16.0",
    "pikepdf>=8.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "img2pdf>=0.5",
]
dnd = ["tkinterdnd2>=0.4"]   # Drag & Drop von Dateien ins Fenster
dev = ["pytest>=7.0"]        # Tests

[project.scripts]
pdfopt = "cli:main"

[tool.setuptools]
py-modules = ["engine", "pdf_optimizer", "cli", "tasks"]
